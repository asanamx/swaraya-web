<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" width="240" height="64">
  <!-- swaraya lockup — mark v5 AXIS + wordmark "swaraya".
       Para fondos oscuros (color claro). Usa Inter via system font. -->
  <g stroke="#F4F6F9" stroke-width="4" stroke-linecap="round" fill="none">
    <line x1="32" y1="10" x2="32" y2="24"/>
    <line x1="32" y1="40" x2="32" y2="54"/>
    <line x1="10" y1="32" x2="24" y2="32"/>
    <line x1="40" y1="32" x2="54" y2="32"/>
    <line x1="44.5" y1="19.5" x2="50" y2="14"/>
  </g>
  <text x="80" y="42" 
        font-family="Inter, system-ui, sans-serif" 
        font-size="30" 
        font-weight="500" 
        letter-spacing="-0.6" 
        fill="#F4F6F9">swaraya</text>
</svg>
