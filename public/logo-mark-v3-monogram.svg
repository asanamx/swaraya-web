<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- swaraya mark — v3 MONOGRAM
       App icon institucional: contenedor cuadrado oscuro con "s" centrada.
       Pensado para favicon, app icon, avatar de redes. -->
  <rect width="64" height="64" rx="14" fill="#05060A"/>
  <!-- Borde sutil para definir el contenedor en fondos también oscuros -->
  <rect x="0.5" y="0.5" width="63" height="63" rx="13.5" fill="none" stroke="#1A1F2B" stroke-width="1"/>
  <!-- s monoline centrada -->
  <path d="M44 22 C44 16 38 14 32 14 C26 14 22 17 22 22 C22 26 26 28 32 30 C38 32 44 34 44 40 C44 46 38 50 32 50 C26 50 20 47 20 42"
        fill="none" stroke="#F4F6F9" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Punto cyan: marca de inteligencia -->
  <circle cx="48" cy="18" r="2.2" fill="#7AC4E0"/>
</svg>
