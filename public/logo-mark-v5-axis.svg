<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- swaraya mark — v5 AXIS
       Glyph axiomático: cinco trazos que convergen en un centro.
       Cuatro cardinales + uno asimétrico (el quinto trazo más corto rompe
       la simetría perfecta, igual que la marca de Anthropic).
       Concepto: múltiples disciplinas que convergen en un principio. -->
  <g stroke="#F4F6F9" stroke-width="3.5" stroke-linecap="round">
    <line x1="32" y1="10" x2="32" y2="24"/>
    <line x1="32" y1="40" x2="32" y2="54"/>
    <line x1="10" y1="32" x2="24" y2="32"/>
    <line x1="40" y1="32" x2="54" y2="32"/>
    <line x1="44" y1="20" x2="38" y2="26"/>
  </g>
</svg>
